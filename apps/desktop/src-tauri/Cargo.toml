[package]
name = "lblr"
version = "0.1.1"
description = "Open-source label designer and print engine for thermal printers"
authors = ["lblr contributors"]
license = "MIT"
repository = "https://github.com/ravinila/lblr"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lblr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Printing",
    "Win32_System_Memory",
    # OpenPrinterW and PRINTER_INFO_2W are gated behind these: their signatures
    # reach into DEVMODEW and the security descriptor types respectively.
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
