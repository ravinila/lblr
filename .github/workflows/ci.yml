name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck desktop app
        run: npx tsc -p apps/desktop/tsconfig.json --noEmit

      - name: Test
        run: pnpm test

      - name: Format
        run: npx prettier --check "packages/**/*.ts" "apps/desktop/src/**/*.{ts,tsx,css}" README.md
